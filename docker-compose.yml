# DSS150P Lab 4 - Docker Compose: pipeline + PostgreSQL

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: dss150p-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  pipeline:
    build: .
    image: dss150p-pipeline:local
    container_name: dss150p-pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SOURCE_FILE_PATH: data/source/dataset.csv
      RANDOM_SEED: ${RANDOM_SEED:-42}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data:/app/data
      - ./metadata:/app/metadata
      - ./outputs:/app/outputs

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: dss150p-airflow:local
    container_name: dss150p-airflow
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AIRFLOW_PORT:-8088}:8080"
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      PIPELINE_PROJECT_DIR: /opt/airflow/project
      PIPELINE_PYTHON: /opt/airflow/pipeline-venv/bin/python
      SOURCE_FILE_PATH: data/source/dataset.csv
      RANDOM_SEED: ${RANDOM_SEED:-42}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - .:/opt/airflow/project
      - airflow_state:/opt/airflow/state
    restart: unless-stopped

volumes:
  pgdata:
  airflow_state: